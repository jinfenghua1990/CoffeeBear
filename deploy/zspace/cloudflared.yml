# Cloudflare Tunnel 目标入口模板（随 docker-compose.tunnel.yml 挂载）。
# 此文件只定义 hostname -> 后端映射，不会创建 DNS 记录或 Cloudflare Access 策略。
# 在 Cloudflare Zero Trust 配置并验证 coffee.alsvidbike.com 的 Access 邮箱 allowlist 前，不要应用此变更。
# Access 外层门禁必须保留，Coffee 自身管理员登录仍然启用；不得直接暴露源站端口。
ingress:
  - hostname: coffee.alsvidbike.com
    service: http://api:8000
  - service: http_status:404
