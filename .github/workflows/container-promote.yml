name: Promote Production Image

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  promote:
    name: Promote tested image without rebuilding
    # 单分支治理：任何合并进 main 的 PR 都晋升；镜像必须已由工作分支推送构建过，
    # 这里只做“校验存在 + 原样 re-tag”，绝不重建。
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release
        id: release
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="v$(TZ=Asia/Shanghai date +'%Y.%m.%d.%H%M%S')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "updater_image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for tested app and updater images
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          UPDATER_IMAGE: ${{ steps.release.outputs.updater_image }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          # The image build runs asynchronously on the PR branch. The PR can be
          # merged before the multi-arch push finishes, so wait for both immutable
          # tags instead of failing the release on a normal build/push race.
          for attempt in $(seq 1 60); do
            app_ok=0
            updater_ok=0
            docker buildx imagetools inspect "${IMAGE}:sha-${SOURCE_SHA}" >/dev/null 2>&1 && app_ok=1 || true
            docker buildx imagetools inspect "${UPDATER_IMAGE}:updater-sha-${SOURCE_SHA}" >/dev/null 2>&1 && updater_ok=1 || true
            if [ "$app_ok" -eq 1 ] && [ "$updater_ok" -eq 1 ]; then
              echo "Both immutable tested images are available."
              exit 0
            fi
            echo "Waiting for candidate image publication (attempt $attempt/60; app=$app_ok updater=$updater_ok)..."
            sleep 10
          done
          echo "::error::Candidate app/updater image was not published within 10 minutes."
          exit 1

      - name: Promote exact tested app and updater images
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.release.outputs.image }}:stable" \
            --tag "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.source_sha }}"
          docker buildx imagetools create \
            --tag "${{ steps.release.outputs.updater_image }}:updater-stable" \
            --tag "${{ steps.release.outputs.updater_image }}:updater-${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.updater_image }}:updater-sha-${{ steps.release.outputs.source_sha }}"

      - name: Resolve promoted digest
        id: digest
        shell: bash
        run: |
          DIGEST="$(docker buildx imagetools inspect \
            "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Resolve promoted updater digest
        id: updater_digest
        shell: bash
        run: |
          DIGEST="$(docker buildx imagetools inspect \
            "${{ steps.release.outputs.updater_image }}:updater-${{ steps.release.outputs.version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.release.outputs.merge_sha }}" \
            --title "${{ steps.release.outputs.version }}" \
            --notes "Promoted tested image \`${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.source_sha }}\` to \`stable\`. Production must deploy this promoted image; do not rebuild it on the NAS.

          **Deploy with digest (Issue #30):**
          \`\`\`
          IMAGE_REF=${{ steps.release.outputs.image }}@${{ steps.digest.outputs.digest }}
          UPDATE_AGENT_IMAGE_REF=${{ steps.release.outputs.updater_image }}@${{ steps.updater_digest.outputs.digest }}
          Source SHA: \`${{ steps.release.outputs.source_sha }}\`
          \`\`\`
          Do not deploy the mutable \`:stable\` tag — a registry remote cache may resolve it to a stale digest."

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Production promotion"
            echo
            echo "Version: \`${{ steps.release.outputs.version }}\`"
            echo
            echo "Image: \`${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}\`"
            echo
            echo "Digest: \`${{ steps.digest.outputs.digest }}\`"
            echo
            echo "IMAGE_REF for deploy.sh: \`${{ steps.release.outputs.image }}@${{ steps.digest.outputs.digest }}\`"
            echo
            echo "Updater image: \`${{ steps.release.outputs.updater_image }}:updater-${{ steps.release.outputs.version }}\`"
            echo
            echo "Updater digest: \`sha256:${{ steps.updater_digest.outputs.digest }}\`"
            echo
            echo "UPDATE_AGENT_IMAGE_REF: \`${{ steps.release.outputs.updater_image }}@${{ steps.updater_digest.outputs.digest }}\`"
            echo
            echo "Source SHA: \`${{ steps.release.outputs.source_sha }}\`"
            echo
            echo "The image was promoted without rebuilding."
          } >> "$GITHUB_STEP_SUMMARY"
