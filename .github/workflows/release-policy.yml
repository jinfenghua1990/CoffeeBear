name: Release Policy

on:
  pull_request:
    branches: [main]

jobs:
  production-source-policy:
    name: Production source branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Require develop or hotfix branch
        shell: bash
        run: |
          case "$GITHUB_HEAD_REF" in
            develop|hotfix/*)
              echo "Allowed production source: $GITHUB_HEAD_REF"
              ;;
            *)
              echo "Production PRs must come from develop or hotfix/*."
              echo "Current source: $GITHUB_HEAD_REF"
              exit 1
              ;;
          esac
